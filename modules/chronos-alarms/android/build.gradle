buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.chronosalarms'
version = '1.0.0'

android {
  namespace "expo.modules.chronosalarms"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  buildFeatures {
    compose true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // ReactFontManager, to share the module's font files with JS text.
  implementation 'com.facebook.react:react-android'
  // Same Compose and Material 3 versions as @expo/ui, so both share one copy.
  implementation 'androidx.compose.foundation:foundation-android:1.12.1'
  implementation 'androidx.compose.ui:ui-android:1.12.1'
  implementation 'androidx.compose.material3:material3-android:1.5.0-beta01'
  implementation 'androidx.graphics:graphics-shapes:1.1.0'
  implementation 'androidx.activity:activity-compose:1.10.1'
  implementation 'androidx.core:core-ktx:1.18.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
